<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Notlar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <section class="app-header">
      <div>
        <p class="eyebrow">Ilk JavaScript Projem</p>
        <h1>Mini Notlar</h1>
        <p class="intro">Kisa notlarini yaz, listele ve daha sonra geri don.</p>
      </div>

      <button id="theme-toggle-button" class="theme-button" type="button" aria-pressed="false">Koyu Tema</button>
    </section>

    <section class="note-panel" aria-labelledby="new-note-title">
      <h2 id="new-note-title">Yeni Not</h2>

      <form id="note-form" class="note-form">
        <label for="note-input">Not metni</label>
        <textarea id="note-input" name="note" rows="4" maxlength="500" placeholder="Bugun neyi not almak istiyorsun?"></textarea>
        <div class="input-info">
          <p id="note-error" class="error-message hidden">Not yazmadiniz.</p>
          <span id="character-count">0 / 500</span>
        </div>

        <div class="form-actions">
          <button id="submit-note-button" type="submit">Not Ekle</button>
          <button id="cancel-edit-button" class="secondary-button hidden" type="button">Vazgec</button>
        </div>
      </form>
    </section>

    <p id="status-message" class="status-message hidden" aria-live="polite"></p>

    <section class="notes-area" aria-labelledby="notes-title">
      <div class="notes-heading">
        <h2 id="notes-title">Notlarim</h2>
        <div class="notes-tools">
          <span id="note-count">0 not</span>
          <button id="clear-notes-button" class="danger-button small-button hidden" type="button">Tumunu Temizle</button>
        </div>
      </div>

      <div class="search-area">
        <label for="search-input">Notlarda ara</label>
        <div class="search-row">
          <input id="search-input" type="search" placeholder="Aranacak kelime...">
          <button id="clear-search-button" class="secondary-button small-button hidden" type="button">Temizle</button>
        </div>
      </div>

      <ul id="notes-list" class="notes-list">
        <li class="empty-state">Henuz not eklenmedi.</li>
      </ul>
    </section>
  </main>

  <div id="delete-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
    <div class="modal-box">
      <h2 id="delete-modal-title">Not Silinsin mi?</h2>
      <p>Bu notu silersen geri alamazsin.</p>

      <div class="modal-actions">
        <button id="cancel-delete-button" class="secondary-button" type="button">Vazgec</button>
        <button id="confirm-delete-button" class="danger-button" type="button">Evet, Sil</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
